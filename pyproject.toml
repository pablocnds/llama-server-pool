[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llama-server-pool"
version = "0.1.0"
description = "A memory-aware process manager and proxy for llama.cpp llama-server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "psutil>=6.1",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[project.scripts]
llama-server-pool = "llama_server_pool.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_server_pool"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
